<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger Pigeon</title>
    <link href="css/style.css" rel="stylesheet">
  </head>

  <body>
    <!-- Project name appears at the top of website -->
    <header class="header-section">
      <div class="title-section">
        <span class="title-text">Messenger Pigeon</span>
      </div>
    </header>

    <div class="chat-log">

    </div>

    <!-- This is the textarea to input user's text to send to server -->
    <div class="userTextbox">
      <div class="userTextbox-inner">
       <textarea placeholder="Type a message..."></textarea>
       <button type="submit">Send</button>
      </div>
    </div>
  </body>
</html>
